# registry/pipeline_health.yaml
#
# Tracks expected data freshness for every table used across pods.
# Pod analysts check this before answering time-sensitive questions.
# The daily CI schedule in evals-ci.yml can be extended to ping these
# and flag stale tables as a GitHub issue automatically.
#
# freshness_sla: how fresh the data should be (T-1 = yesterday)
# check_query: a lightweight query to get the max date in the table
# alert_if_stale_days: raise a flag if data is older than this

version: 1

tables:

  - table: storm-wall-185017.adsc_gold.fact_adsc_orders
    pod: adsc
    freshness_sla: T-1
    check_query: "SELECT MAX(created_date) AS latest FROM `storm-wall-185017.adsc_gold.fact_adsc_orders`"
    alert_if_stale_days: 2
    owner: yash.mittal@acko.tech

  - table: storm-wall-185017.adsc_gold.fact_adsc_nps
